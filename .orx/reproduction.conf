# Tracked experimental condition. Child experiments vary this file, while
# every node retains the same `bash .orx/run.sh` command.
OFFICIAL_REPO=https://github.com/jinyangwu/SEED.git
OFFICIAL_COMMIT=2cf2fadca3c5aba28da68e8e1405182ba8d90e6c
MODEL_ID=Qwen/Qwen2.5-3B-Instruct
MODEL_LABEL=qwen2.5-3b-instruct-base

# Paper-compatible ALFWorld evaluation protocol.
EVAL_DATASET=eval_in_distribution
ENV_NUM=134
TEST_TIMES=3
MAX_STEPS=30
HISTORY_LENGTH=5
TEMPERATURE=0.4
MAX_COMPLETION_TOKENS=512
ENV_SEED=1

# Eight replicas serve disjoint requests concurrently. The 3B checkpoint fits
# on one device; data parallelism is used to accelerate the complete benchmark.
TENSOR_PARALLEL_SIZE=1
DATA_PARALLEL_SIZE=8
GPU_MEMORY_UTILIZATION=0.6
MAX_MODEL_LEN=4096
