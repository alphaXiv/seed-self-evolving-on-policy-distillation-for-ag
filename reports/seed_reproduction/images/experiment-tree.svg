<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="title desc">
  <title id="title">Prepared SEED experiment tree</title>
  <desc id="desc">An immutable Qwen base evaluator root branches to the released SEED checkpoint, with the same evaluation command and a two-line configuration difference.</desc>
  <rect width="1120" height="480" fill="#f7f8fc"/>
  <text x="560" y="48" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700" fill="#18212f">Prepared experiment tree</text>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="285" y="90" width="550" height="125" rx="18" fill="#e8efff" stroke="#5271c4" stroke-width="2"/>
    <text x="560" y="128" text-anchor="middle" font-size="21" font-weight="700" fill="#244183">Baseline · immutable root</text>
    <text x="560" y="160" text-anchor="middle" font-size="17" fill="#40516f">Qwen/Qwen2.5-3B-Instruct</text>
    <text x="560" y="189" text-anchor="middle" font-size="15" fill="#68758d">134 environments × 3 rounds · no recorded run</text>

    <path d="M560 215 V276" stroke="#78859a" stroke-width="3"/>
    <polygon points="552,276 568,276 560,289" fill="#78859a"/>
    <rect x="215" y="290" width="690" height="135" rx="18" fill="#eaf8f1" stroke="#3a9b70" stroke-width="2"/>
    <text x="560" y="329" text-anchor="middle" font-size="21" font-weight="700" fill="#1d684b">Released SEED checkpoint · child</text>
    <text x="560" y="361" text-anchor="middle" font-size="17" fill="#3b5d50">Jinyang23/Seed-AlfWorld-3B</text>
    <text x="560" y="391" text-anchor="middle" font-size="15" fill="#537568">Same command; only MODEL_ID and MODEL_LABEL change · no recorded run</text>
  </g>
  <text x="560" y="457" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#586579">Fixed command on both nodes: bash .orx/run.sh</text>
</svg>
