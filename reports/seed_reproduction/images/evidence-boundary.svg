<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
  <title id="title">Evidence boundary for the SEED reproduction</title>
  <desc id="desc">The paper reports metrics and the repository implements a protocol, but no runs produced observed metrics, yielding a not reproduced verdict.</desc>
  <rect width="1120" height="420" fill="#f7f8fc"/>
  <text x="560" y="50" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700" fill="#18212f">Evidence boundary</text>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="55" y="105" width="285" height="210" rx="18" fill="#e8efff" stroke="#5271c4" stroke-width="2"/>
    <text x="197" y="145" text-anchor="middle" font-size="21" font-weight="700" fill="#244183">Paper reference</text>
    <text x="197" y="190" text-anchor="middle" font-size="40" font-weight="700" fill="#244183">91.8</text>
    <text x="197" y="222" text-anchor="middle" font-size="16" fill="#40516f">SEED ALFWorld macro-average</text>
    <text x="197" y="258" text-anchor="middle" font-size="16" fill="#40516f">GRPO reference: 75.0</text>
    <text x="197" y="285" text-anchor="middle" font-size="14" fill="#68758d">Not a reproduction measurement</text>

    <path d="M355 210 H415" stroke="#78859a" stroke-width="3"/>
    <polygon points="415,202 428,210 415,218" fill="#78859a"/>

    <rect x="430" y="105" width="260" height="210" rx="18" fill="#eaf8f1" stroke="#3a9b70" stroke-width="2"/>
    <text x="560" y="145" text-anchor="middle" font-size="21" font-weight="700" fill="#1d684b">Implemented protocol</text>
    <text x="560" y="190" text-anchor="middle" font-size="28" font-weight="700" fill="#1d684b">Pinned + controlled</text>
    <text x="560" y="227" text-anchor="middle" font-size="16" fill="#3b5d50">Official evaluator</text>
    <text x="560" y="254" text-anchor="middle" font-size="16" fill="#3b5d50">Two checkpoint conditions</text>
    <text x="560" y="281" text-anchor="middle" font-size="16" fill="#3b5d50">Log-complete JSON output</text>

    <path d="M705 210 H765" stroke="#78859a" stroke-width="3"/>
    <polygon points="765,202 778,210 765,218" fill="#78859a"/>

    <rect x="780" y="105" width="285" height="210" rx="18" fill="#fff0ef" stroke="#c9504d" stroke-width="2"/>
    <text x="922" y="145" text-anchor="middle" font-size="21" font-weight="700" fill="#8d2d2a">Observed evidence</text>
    <text x="922" y="195" text-anchor="middle" font-size="38" font-weight="700" fill="#8d2d2a">0 runs</text>
    <text x="922" y="230" text-anchor="middle" font-size="16" fill="#674645">16-GPU allocation · 0.0 wall hours</text>
    <text x="922" y="265" text-anchor="middle" font-size="18" font-weight="700" fill="#8d2d2a">NOT REPRODUCED</text>
  </g>
  <text x="560" y="370" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#586579">A prepared protocol is not empirical confirmation; only terminal run logs can cross the evidence boundary.</text>
</svg>
