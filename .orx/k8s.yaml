apiVersion: batch/v1
kind: Job
metadata:
  name: seed-eval-{{ORX_RUN}}
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: run
          image: vllm/vllm-openai:v0.11.0
          command: ["bash", "-c", "eval \"$ORX_SCRIPT\""]
          resources:
            requests:
              nvidia.com/gpu: "8"
              cpu: "64"
              memory: 512Gi
              ephemeral-storage: 350Gi
            limits:
              nvidia.com/gpu: "8"
              cpu: "96"
              memory: 768Gi
              ephemeral-storage: 500Gi
